<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCrew</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-wrap">
  <div id="layout">
    <aside id="sidebar">
      <div class="logo">AutoCrew · 编辑部</div>
      <button id="new-task" class="btn-primary sidebar-new-task">＋ 新任务</button>
      <div class="sidebar-section">
        <div class="sidebar-heading">任务历史</div>
        <div id="conversation-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">数字员工</div>
        <div id="crew-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-heading">即将上线</div>
        <div class="sidebar-item disabled" title="敬请期待">定时任务</div>
        <div class="sidebar-item disabled" title="敬请期待">插件</div>
        <div class="sidebar-item disabled" title="敬请期待">消息渠道</div>
        <div class="sidebar-item disabled" title="敬请期待">团队</div>
      </div>
      <div id="sidebar-footer">
        <button class="sidebar-item" id="open-settings">设置</button>
        <div class="sidebar-user" title="账号与积分将随产品账号体系上线">本地版</div>
      </div>
    </aside>
    <section id="main-area" class="hero-mode">
      <div id="hero-block">
        <div class="hero-title">编辑部就位</div>
        <p class="hero-sub">直接说需求，比如：帮我写一条关于 Excel 快捷键的抖音口播。</p>
        <div id="hero-chips"></div>
      </div>
      <div id="chat-stream"></div>
      <div id="chat-input-row">
        <textarea id="chat-input" rows="2" placeholder="告诉团队你想做什么…"></textarea>
        <button id="chat-send" class="btn-primary">发送</button>
      </div>
    </section>
    <div id="drawer-mask" class="hidden"></div>
    <aside id="drawer" class="drawer-closed" aria-hidden="true">
      <header id="drawer-header">
        <span id="drawer-title"></span>
        <button id="drawer-close" class="btn-mini" title="关闭">✕</button>
      </header>
      <div id="drawer-body">
        <section id="panel-report" class="panel"></section>
        <section id="panel-drafts" class="panel"></section>
        <section id="panel-style" class="panel"></section>
        <section id="panel-settings" class="panel"></section>
        <section id="panel-scout" class="panel"></section>
      </div>
    </aside>
  </div>
  <div id="toast" class="toast hidden"></div>
  </div>
  <script src="dom.js"></script>
  <script src="markdown.cjs"></script>
  <script src="drawer.js"></script>
  <script src="cards.js"></script>
  <script src="selection.js"></script>
  <script src="workbench.js"></script>
  <script src="chat.js"></script>
  <script src="sidebar.js"></script>
  <script src="scout.js"></script>
  <script src="settings.js"></script>
  <script src="onboarding.js"></script>
  <script src="app.js"></script>
</body>
</html>
