<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; connect-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCrew · 编辑部</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-wrap">
    <header id="topbar">
      <span class="logo" id="logo-home" title="回工作台">AutoCrew · 编辑部</span>
      <div class="topbar-actions">
        <button id="nav-board" class="btn-secondary">看板</button>
        <button id="new-task" class="btn-primary">＋ 新想法</button>
        <div class="menu-wrap">
          <button id="menu-btn" class="btn-secondary">菜单</button>
          <div id="menu-drop" class="menu-drop hidden">
            <button class="menu-item" data-view="report">数据回流</button>
            <button class="menu-item" data-view="library">素材库</button>
            <button class="menu-item" data-view="trash">回收站</button>
            <button class="menu-item" data-view="settings">设置</button>
          </div>
        </div>
      </div>
    </header>

    <div id="body-zone">
      <section id="main-area">
        <section id="view-dashboard" class="view"></section>
        <section id="view-board" class="view hidden"></section>
        <section id="view-destination" class="view hidden">
          <header id="dest-header">
            <button id="dest-back" class="btn-mini">← 看板</button>
            <span id="dest-title"></span>
          </header>
          <div id="dest-body">
            <section id="panel-report" class="panel"></section>
            <section id="panel-drafts" class="panel"></section>
            <section id="panel-style" class="panel"></section>
            <section id="panel-settings" class="panel"></section>
            <section id="panel-scout" class="panel"></section>
            <section id="panel-library" class="panel"></section>
          </div>
        </section>
      </section>

      <aside id="chat-zone">
        <div id="chat-head"><span>总编辑</span></div>
        <div id="chat-stream"></div>
        <div id="chat-input-row">
          <textarea id="chat-input" rows="2" placeholder="有想法就说 / 让总编辑干活…"></textarea>
          <button id="chat-send" class="btn-primary">发送</button>
        </div>
      </aside>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="config.js"></script>
  <script src="transport.js"></script>
  <script src="dom.js"></script>
  <script src="markdown.cjs"></script>
  <script src="store.js"></script>
  <script src="views.js"></script>
  <script src="cards.js"></script>
  <script src="selection.js"></script>
  <script src="workbench.js"></script>
  <script src="board.js"></script>
  <script src="dashboard.js"></script>
  <script src="library.js"></script>
  <script src="chat.js"></script>
  <script src="sidebar.js"></script>
  <script src="scout.js"></script>
  <script src="settings.js"></script>
  <script src="onboarding.js"></script>
  <script src="app.js"></script>
</body>
</html>
