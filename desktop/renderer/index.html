<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; connect-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCrew · 编辑部</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-wrap">
  <div id="layout">
    <aside id="sidebar">
      <div class="logo">AutoCrew · 编辑部</div>
      <button id="new-task" class="btn-primary sidebar-new-task">＋ 新任务</button>
      <nav id="sidebar-nav">
        <button class="nav-item active" data-view="today"><i class="nav-ico">⌂</i>今日</button>
        <button class="nav-item" data-view="scout"><i class="nav-ico">侦</i>选题</button>
        <button class="nav-item" data-view="drafts"><i class="nav-ico">编</i>内容</button>
        <button class="nav-item" data-view="report"><i class="nav-ico">析</i>数据</button>
        <button class="nav-item" data-view="library"><i class="nav-ico">▤</i>素材</button>
      </nav>
      <div id="sidebar-footer">
        <button class="nav-item" data-view="settings"><i class="nav-ico">⚙</i>设置</button>
        <div class="sidebar-user" title="账号与积分将随产品账号体系上线">本地版</div>
      </div>
    </aside>
    <section id="main-area">
      <section id="view-today" class="view"></section>
      <section id="view-conversation" class="view hidden">
        <div id="chat-stream"></div>
        <div id="chat-input-row">
          <textarea id="chat-input" rows="2" placeholder="继续这个任务…"></textarea>
          <button id="chat-send" class="btn-primary">发送</button>
        </div>
      </section>
      <section id="view-destination" class="view hidden">
        <header id="dest-header"><span id="dest-title"></span></header>
        <div id="dest-body">
          <section id="panel-report" class="panel"></section>
          <section id="panel-drafts" class="panel"></section>
          <section id="panel-style" class="panel"></section>
          <section id="panel-settings" class="panel"></section>
          <section id="panel-scout" class="panel"></section>
          <section id="panel-library" class="panel"></section>
        </div>
      </section>
    </section>
  </div>
  <div id="toast" class="toast hidden"></div>
  </div>
  <script src="config.js"></script>
  <script src="transport.js"></script>
  <script src="dom.js"></script>
  <script src="markdown.cjs"></script>
  <script src="store.js"></script>
  <script src="views.js"></script>
  <script src="cards.js"></script>
  <script src="selection.js"></script>
  <script src="workbench.js"></script>
  <script src="library.js"></script>
  <script src="chat.js"></script>
  <script src="today.js"></script>
  <script src="sidebar.js"></script>
  <script src="scout.js"></script>
  <script src="settings.js"></script>
  <script src="onboarding.js"></script>
  <script src="app.js"></script>
</body>
</html>
